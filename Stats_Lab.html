<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats Lab</title>
<style>
/* TU/e Crime Scene Investigation Board theme for the Stats Lab masterclass.
   Corkboard in a wooden frame; every lab, note card and question is a pinned manila dossier.
   Canvas figures read the colour variables below, so the charts follow the evidence palette. */
:root{color-scheme:light;
--bg:#8c6239;--ink:#1c1c1c;--muted:#5a4632;--cobalt:#1f3a5f;--strip:#fdfbf7;--pale:#fdfbf7;
--line:#cdb894;--accent:#d9730d;--accentsoft:#f6d9b8;--good:#1b5e20;--bad:#a31621;--card:#fdfbf7;--grey:#9b8c78;
--paper:#fdfbf7;--manila:#e6ccb2;--typed:#f4eee1;--postit:#fff68f;--red:#a31621;--wood:#3d2610}
*{box-sizing:border-box;min-width:0}
html{background:var(--wood)}
body{margin:0;position:relative;min-height:100vh;color:var(--ink);font:16px/1.55 "Courier New",Courier,monospace;overflow-x:clip;
 background-color:#8c6239;
 background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.07) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(0,0,0,.12) 0 2px,transparent 3px),radial-gradient(circle at 40% 80%,rgba(255,235,200,.08) 0 1.5px,transparent 2.5px),radial-gradient(circle at 85% 15%,rgba(0,0,0,.1) 0 1.5px,transparent 2.5px);
 background-size:23px 23px,31px 31px,17px 17px,41px 41px;
 border:16px solid #3d2610;box-shadow:inset 0 0 50px rgba(0,0,0,.75);padding-top:96px}
h1,h2,h3{font-family:"Courier New",Courier,monospace;line-height:1.15;text-wrap:balance;margin:0;text-transform:uppercase;border-bottom:2px solid #1c1c1c;padding-bottom:4px}

/* page furniture: scrolls away with the page */
.postit{position:absolute;top:18px;left:18px;z-index:5;background:#fff68f;color:#1c1c1c;font-weight:700;font-size:14px;text-decoration:none;padding:12px 14px;transform:rotate(-3deg);box-shadow:3px 4px 8px rgba(0,0,0,.45)}
.postit:hover{background:#fff27a}
.tape{position:absolute;top:26px;right:-6px;z-index:5;pointer-events:none;transform:rotate(2deg);display:flex;align-items:center;gap:12px;padding:7px 18px;font-weight:700;font-size:14px;letter-spacing:.04em;color:#1c1c1c;
 background:repeating-linear-gradient(-45deg,#f7c600 0 18px,#1c1c1c 18px 36px);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.tape .lbl{background:#f7c600;padding:2px 8px}
.tape .tag{background:#1c1c1c;color:#fff;padding:2px 7px;font-size:12px}

/* page header: tilted paper label with masking tape */
.strip{position:relative;max-width:1100px;margin:10px auto 22px;width:calc(100% - 32px);background:#fdfbf7;color:#1c1c1c;padding:24px 22px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;transform:rotate(-.8deg);box-shadow:4px 6px 14px rgba(0,0,0,.45);border:1px solid #d8cbb5}
.strip::before{content:"";position:absolute;top:-13px;left:50%;width:150px;height:28px;margin-left:-75px;background:rgba(236,224,190,.82);transform:rotate(2deg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.strip h1{font-size:clamp(26px,4vw,38px);font-weight:700}
.strip p{margin:6px 0 0;max-width:62ch;color:#3a3a3a}
.strip .logo{width:56px;height:56px;flex:none}
.meter{margin-left:auto;min-width:200px;font-size:14px}
.meter b{font-size:20px}
.bar{height:16px;background:#f4eee1;border:2px solid #1c1c1c;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#1b5e20;width:0;transition:width .4s}

/* topic rail: typed index tabs */
nav{display:flex;gap:8px;overflow-x:auto;padding:10px max(3vw,14px) 14px;max-width:1240px;margin:0 auto}
nav a{flex:none;text-decoration:none;color:#1c1c1c;background:#f4eee1;border:1px solid #1c1c1c;padding:9px 14px;font-size:14px;font-weight:700;min-height:42px;display:flex;align-items:center;gap:6px;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
nav a:hover,nav a.on{background:#fff68f}
nav a.on{box-shadow:inset 0 0 0 2px #1c1c1c}
nav a.done::after{content:"✓";color:#1b5e20;font-weight:700}

main{max-width:1240px;margin:0 auto;padding:clamp(18px,3vw,34px) max(3vw,14px) 60px}
.topic{display:none}.topic.show{display:block}
.topic>h2{font-size:clamp(24px,3.4vw,38px);color:#fdfbf7;border-color:#fdfbf7;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.lede{font-size:17px;color:#fdfbf7;max-width:70ch;margin:10px 0 34px;text-shadow:0 1px 3px rgba(0,0,0,.7)}

/* dossier cards */
.lab,.box,.q{position:relative;background:#fdfbf7;border:1px solid #cbb89a;border-top:12px solid #e6ccb2;box-shadow:4px 6px 14px rgba(0,0,0,.45);padding:22px 16px 16px}
.lab::before,.box::before,.q::before{content:"";position:absolute;top:-20px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;z-index:2;
 background:radial-gradient(circle at 35% 35%,#ff6b6b 0 2px,#c4161c 4px,#7a0b10 9px);box-shadow:2px 3px 3px rgba(0,0,0,.5)}
.lab::after,.box::after,.q::after{content:"";position:absolute;top:-22px;left:18px;width:70px;height:10px;background:#e6ccb2;border-radius:4px 4px 0 0}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:34px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.cap{font-size:14px;color:#5a4632;margin:0 0 10px}
.fig{position:relative;min-height:340px;background:#fff;border:1px solid #cbb89a;box-shadow:inset 0 0 0 4px #fdfbf7}
.fig>canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:14px;align-items:flex-end}
.sl{display:flex;flex-direction:column;flex:1 1 180px;font-size:14px}
.sl label{display:flex;justify-content:space-between;gap:8px}
.sl output{font-weight:700;color:#a31621;white-space:nowrap}
input[type=range]{width:100%;height:44px;accent-color:#a31621}

/* buttons: red rubber ink stamps */
button{font:700 14px "Courier New",Courier,monospace;text-transform:uppercase;letter-spacing:.04em;min-height:44px;padding:8px 16px;border:3px double #a31621;background:transparent;color:#a31621;cursor:pointer;transition:transform .15s}
button:hover{transform:rotate(-2deg);background:rgba(163,22,33,.06)}
button.ghost{background:transparent;color:#a31621}

/* segmented controls: typed form fields */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#f4eee1;color:#1c1c1c;border:1px solid #1c1c1c;text-transform:none;letter-spacing:0}
.seg button:hover,.seg button.on{background:#fff68f;transform:none}
.seg button.on{box-shadow:inset 0 0 0 2px #1c1c1c}

/* readouts: typed evidence tags */
.read{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.read div{background:#f4eee1;border:1px solid #cbb89a;border-left:6px solid #8c6239;padding:9px 11px;font-size:13px;color:#5a4632}
.read b{display:block;font-size:17px;color:#1c1c1c;overflow-wrap:anywhere}
.read .hot{background:#fff68f}
.read .hot b{color:#a31621}

.words{display:flex;flex-direction:column;gap:40px}
.words ul{margin:0;padding-left:20px}.words li{margin-bottom:10px}
.box h3{font-size:16px;margin-bottom:10px}
.rule code{display:block;font:14px/1.7 "Courier New",Courier,monospace;color:#1c1c1c;background:#f4eee1;padding:2px 8px;margin-bottom:4px}
.exam{border-left:6px solid #a31621}
table.t{border-collapse:collapse;font-size:15px;width:100%;background:#fff}
.t td,.t th{border:1px solid #8c6239;padding:8px;text-align:center}

/* quick check */
.quiz{margin-top:44px}
.quiz>h3{font-size:22px;margin-bottom:6px;color:#fdfbf7;border-color:#fdfbf7;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.quiz>.cap{color:#fdfbf7;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.q{margin-top:40px}
.q p{margin:0 0 14px;font-weight:700;text-decoration:underline;text-underline-offset:4px}
.opts{display:grid;gap:16px}
.opts button{position:relative;text-align:left;background:#f4eee1;color:#1c1c1c;border:0;border-left:6px solid #8c6239;text-transform:none;letter-spacing:0;font-weight:400;font-size:15px;opacity:1;transition:background .15s}
.opts button:hover{background:#fff68f;transform:none}
.opts button:disabled{opacity:1;color:#1c1c1c;cursor:default}
.opts button.ok,.opts button.no{background:#fff68f}
.opts button.ok{box-shadow:inset 0 0 0 3px #fff68f,inset 0 0 0 4px #1b5e20;border-left-color:#1b5e20;outline:3px double #1b5e20;outline-offset:-1px}
.opts button.no{border-left-color:#a31621;outline:3px double #a31621;outline-offset:-1px}
.opts button.ok::after,.opts button.no::after{position:absolute;top:-11px;right:12px;font:700 11px "Courier New",Courier,monospace;letter-spacing:.08em;padding:1px 6px;background:#fdfbf7;transform:rotate(-3deg)}
.opts button.ok::after{content:"VERIFIED";color:#1b5e20;border:3px double #1b5e20}
.opts button.no::after{content:"REJECTED";color:#a31621;border:3px double #a31621}

/* feedback stamp, chosen in CSS from the option state */
.expl{margin-top:16px;font-size:15px;color:#1c1c1c;display:none;padding:12px 14px;border:3px double #a31621;background:#ffebee}
.expl::before{display:block;font-weight:700;letter-spacing:.06em;margin-bottom:6px;content:"REJECTED / DISCREPANCY";color:#a31621}
.q:has(.ok) .expl{border-color:#1b5e20;background:#e8f5e9}
.q:has(.ok) .expl::before{content:"VERIFIED / CLEARED";color:#1b5e20}
.q.answered .expl{display:block}

.next{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.next a{background:#fff68f;color:#1c1c1c;font-weight:700;text-decoration:none;padding:10px 14px;box-shadow:3px 4px 8px rgba(0,0,0,.45)}
.next a:first-child{transform:rotate(-2deg)}.next a:last-child{transform:rotate(2deg)}
.bit{position:fixed;width:10px;height:10px;pointer-events:none;z-index:9;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.probe{position:absolute;width:0;height:0;overflow:hidden}
.foot{font-size:13px;color:#fdfbf7;margin-top:30px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
pre,.scroll{overflow-x:auto}

button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1c1c1c;outline-offset:3px;box-shadow:0 0 0 6px #f7c600}

@media(max-width:640px){
 body{border-width:8px;padding-top:78px}
 .postit{top:10px;left:10px;font-size:12px;padding:9px 10px}
 .tape{top:16px;font-size:11px;padding:5px 10px;gap:8px}
 .tape .tag{font-size:10px}
 .strip{width:calc(100% - 20px);padding:20px 14px 14px}
 .meter{margin-left:0}
 .lab,.box,.q{padding:20px 12px 14px}
}
@media(max-width:520px){body{padding-top:108px}.tape{top:58px}}
@media(max-width:370px){.tape .tag{display:none}.tape{font-size:10px}}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{transition:none!important;animation:none!important}
 button:hover,.opts button:hover{transform:none}
 .bit{display:none}
}
</style>
</head>
<body>
<a class="postit" href="https://wpleenheer-ship-it.github.io/TU-e/">← RETURN TO EVIDENCE BOARD</a>
<div class="tape" aria-hidden="true"><span class="lbl">DO NOT CROSS // EXAM AREA</span><span class="tag">TU/e</span></div>
<header class="strip">
<svg class="logo" viewBox="0 0 56 56" aria-hidden="true"><rect x="4" y="4" width="48" height="48" rx="8" fill="#fdfbf7" stroke="#1c1c1c" stroke-width="3"/><g fill="#a31621"><circle cx="17" cy="17" r="5"/><circle cx="28" cy="28" r="5"/><circle cx="39" cy="39" r="5"/></g></svg>
<div><h1>Stats Lab: case files</h1><p>Every topic from your T-exercises as a machine you can run. Read the plain words, examine the evidence in the lab, then pass the check.</p></div>
<div class="meter"><b id="mcount">0 / 15</b> cases closed<div class="bar"><i id="mbar"></i></div></div>
</header>
<nav id="nav" class="scroll" aria-label="Topics"></nav>
<main id="main"></main>
<span class="probe" id="probe"></span>
<script>
{
/* ---------- maths helpers ---------- */
const erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y};
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
const npdf=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
const randn=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())};
const lf=[0];for(let i=1;i<400;i++)lf[i]=lf[i-1]+Math.log(i);
const binom=(n,k,p)=>k<0||k>n?0:Math.exp(lf[n]-lf[k]-lf[n-k]+k*Math.log(p)+(n-k)*Math.log(1-p));
const pois=(k,m)=>Math.exp(-m+k*Math.log(m)-lf[k]);
const T95=[12.706,4.303,3.182,2.776,2.571,2.447,2.365,2.306,2.262,2.228,2.201,2.179,2.16,2.145,2.131,2.12,2.11,2.101,2.093,2.086,2.08,2.074,2.069,2.064,2.06,2.056,2.052,2.048,2.045,2.042];
const t95=df=>df<1?NaN:df<=30?T95[df-1]:1.96;
const f=(v,d=3)=>isFinite(v)?(+v).toFixed(d):'—';
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const vari=a=>{const m=mean(a);return a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1)};

/* ---------- drawing helpers ---------- */
const probe=document.getElementById('probe');
const col=n=>{probe.style.color='var(--'+n+')';return getComputedStyle(probe).color};
const alpha=(c,a)=>c.replace('rgb(','rgba(').replace(')',','+a+')');
const figs=[];
function Fig(parent,h){const d=document.createElement('div');d.className='fig';d.style.minHeight=h+'px';const c=document.createElement('canvas');d.appendChild(c);parent.appendChild(d);
 const F={c,d,draw:null,ax:null,render(){const w=d.clientWidth,hh=d.clientHeight;if(w<20)return;const r=window.devicePixelRatio||1;c.width=w*r;c.height=hh*r;const x=c.getContext('2d');x.setTransform(r,0,0,r,0,0);x.clearRect(0,0,w,hh);x.font='12px Inter,sans-serif';F.draw&&F.draw(x,w,hh)}};
 const ro=new ResizeObserver(()=>F.render());ro.observe(d);figs.push(F);return F}
function nice(span,n){const r=span/n,p=10**Math.floor(Math.log10(r)),m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p}
function axes(x,w,h,o){const L=o.left??46,R=o.right??14,T=o.top??16,B=o.bottom??(o.xl?48:36);
 const X=v=>L+(v-o.x0)/(o.x1-o.x0)*(w-L-R),Y=v=>h-B-(v-o.y0)/(o.y1-o.y0)*(h-T-B);
 const ln=col('line'),mu=col('muted');x.strokeStyle=ln;x.fillStyle=mu;x.lineWidth=1;
 x.beginPath();x.moveTo(L,T);x.lineTo(L,h-B);x.lineTo(w-R,h-B);x.stroke();
 const xs=o.xstep||nice(o.x1-o.x0,w<520?4:7);x.textAlign='center';x.textBaseline='top';
 for(let v=Math.ceil(o.x0/xs-1e-9)*xs;v<=o.x1+1e-9;v+=xs){x.fillText(o.xfmt?o.xfmt(v):+v.toFixed(4),X(v),h-B+6)}
 if(!o.noy){const ys=o.ystep||nice(o.y1-o.y0,4);x.textAlign='right';x.textBaseline='middle';for(let v=Math.ceil(o.y0/ys-1e-9)*ys;v<=o.y1+1e-9;v+=ys){x.fillText(+v.toFixed(4),L-6,Y(v));x.strokeStyle=alpha(ln,.5);x.beginPath();x.moveTo(L,Y(v));x.lineTo(w-R,Y(v));x.stroke()}}
 if(o.xl){x.textAlign='right';x.textBaseline='bottom';x.fillText(o.xl+' →',w-R,h-2)}
 return {X,Y,L,R,T,B}}
function curve(x,A,fn,a,b,color,lw=2.5,dash){x.strokeStyle=color;x.lineWidth=lw;x.setLineDash(dash||[]);x.beginPath();const n=200;for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;const y=fn(v);i?x.lineTo(A.X(v),A.Y(y)):x.moveTo(A.X(v),A.Y(y))}x.stroke();x.setLineDash([])}
function area(x,A,fn,a,b,color){x.fillStyle=color;x.beginPath();x.moveTo(A.X(a),A.Y(0));const n=120;for(let i=0;i<=n;i++){const v=a+(b-a)*i/n;x.lineTo(A.X(v),A.Y(fn(v)))}x.lineTo(A.X(b),A.Y(0));x.closePath();x.fill()}
function label(x,t,px,py,color,align='left',bold){x.font=(bold?'600 ':'')+'13px Inter,sans-serif';x.fillStyle=color;x.textAlign=align;x.textBaseline='middle';x.fillText(t,px,py);x.font='12px Inter,sans-serif'}
function hist(data,a,b,bins){const c=new Array(bins).fill(0),w=(b-a)/bins;for(const v of data){const i=Math.floor((v-a)/w);if(i>=0&&i<bins)c[i]++}return c.map(k=>k/(data.length*w))}
function drawHist(x,A,h,a,b,color){const w=(b-a)/h.length;x.fillStyle=color;h.forEach((v,i)=>{const x0=A.X(a+i*w),x1=A.X(a+(i+1)*w);x.fillRect(x0+.5,A.Y(v),x1-x0-1,A.Y(0)-A.Y(v))})}

/* ---------- control helpers ---------- */
let uid=0;
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function slider(box,o,cb){const id='s'+(++uid),w=el('div','sl');w.innerHTML=`<label for="${id}"><span>${o.label}</span><output></output></label><input id="${id}" type="range" min="${o.min}" max="${o.max}" step="${o.step}" value="${o.value}">`;box.appendChild(w);
 const i=w.querySelector('input'),out=w.querySelector('output');const upd=()=>{out.textContent=o.fmt?o.fmt(+i.value):i.value};upd();i.addEventListener('input',()=>{upd();cb()});
 const g=()=>+i.value;g.set=v=>{i.value=v;upd()};return g}
function btn(box,t,fn,ghost){const b=el('button',ghost?'ghost':'',t);b.type='button';b.addEventListener('click',fn);box.appendChild(b);return b}
function seg(box,opts,val,cb){const w=el('div','seg');let cur=val;opts.forEach(([v,t])=>{const b=el('button',v===val?'on':'',t);b.type='button';b.addEventListener('click',()=>{cur=v;[...w.children].forEach(c=>c.classList.toggle('on',c===b));cb(v)});w.appendChild(b)});box.appendChild(w);return ()=>cur}
function readout(box){const r=el('div','read');box.appendChild(r);return items=>{r.innerHTML=items.map(([l,v,hot])=>`<div class="${hot?'hot':''}"><b>${v}</b>${l}</div>`).join('')}}

/* ---------- topic labs ---------- */
const LABS={
describe(lab){
 let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const rn=()=>Math.sqrt(-2*Math.log(rnd()))*Math.cos(2*Math.PI*rnd());
 const base=Array.from({length:40},()=>Math.round(62+9*rn()));
 const F=Fig(lab,380),c=el('div','ctrls');lab.appendChild(c);let view='stem',out=false,drift=false;
 seg(c,[['stem','Stem-and-leaf'],['hist','Histogram'],['box','Box plot'],['time','Time sequence'],['prob','Probability plot']],'stem',v=>{view=v;go()});
 const bins=slider(c,{label:'histogram bin width',min:2,max:15,step:1,value:5},go);
 seg(c,[[0,'No outlier'],[1,'Add outlier (118)']],0,v=>{out=!!v;go()});seg(c,[[0,'Steady machine'],[1,'Machine drifts']],0,v=>{drift=!!v;go()});
 const R=readout(lab);
 const data=()=>{const d=base.map((v,i)=>drift?Math.round(v-12+i*0.6):v);if(out)d.push(118);return d};
 const qt=(s,p)=>{const pos=(s.length+1)*p;const i=Math.floor(pos);if(i<1)return s[0];if(i>=s.length)return s[s.length-1];return s[i-1]+(pos-i)*(s[i]-s[i-1])};
 const qnorm=p=>{let lo=-8,hi=8;for(let i=0;i<60;i++){const m=(lo+hi)/2;Phi(m)<p?lo=m:hi=m}return (lo+hi)/2};
 F.draw=(x,w,h)=>{const d=data(),s=[...d].sort((a,b)=>a-b),ink=col('ink'),mu=col('muted');
  if(view==='stem'){const st={};s.forEach(v=>{const k=Math.floor(v/10);(st[k]=st[k]||[]).push(v%10)});const ks=Object.keys(st).map(Number);const k0=Math.min(...ks),k1=Math.max(...ks);

 const pos=e=>{const r=F.c.getBoundingClientRect(),A=F.ax;const px=e.clientX-r.left,py=e.clientY-r.top;return [px,py,ax.x0+(px-A.L)/(r.width-A.L-A.R)*(ax.x1-ax.x0),ax.y0+(r.height-A.B-py)/(r.height-A.T-A.B)*(ax.y1-ax.y0)]};
 F.c.addEventListener('pointerdown',e=>{if(!F.ax)return;const [px,py,vx,vy]=pos(e);drag=P.findIndex(([a,b])=>Math.hypot(F.ax.X(a)-px,F.ax.Y(b)-py)<16);if(drag<0&&vx>ax.x0&&vx<ax.x1&&vy>ax.y0&&vy<ax.y1){P.push([vx,vy]);drag=P.length-1}F.c.setPointerCapture(e.pointerId);go()});
 F.c.addEventListener('pointermove',e=>{if(drag<0)return;const [, ,vx,vy]=pos(e);P[drag]=[Math.max(-3,Math.min(3,vx)),Math.max(-8,Math.min(8,vy))];go()});
 F.c.addEventListener('pointerup',()=>{drag=-1;go()});
 function go(){const m=fit(),v=x0(),yh=m.b0+m.b1*v,hw=t95(m.n-2)*Math.sqrt(m.s2*(1+1/m.n+(v-m.mx)**2/m.sxx));
  R([['slope β̂₁ = Sxy/Sxx',f(m.b1,3),1],['intercept β̂₀',f(m.b0,3)],['s² = SSE/(n−2)',f(m.s2,4)],['R²',f(m.r2,3)],['ŷ at x₀ = '+v.toFixed(1),f(yh,2)],['95% PI (t = '+f(t95(m.n-2),3)+')',`(${f(yh-hw,2)}, ${f(yh+hw,2)})`,1]]);F.render()}
 go()}

{id:'describe',nav:'Describing data',title:'Describing data: summaries and plots',lede:'Before any model, look at the data. One set of 40 measured bolts, five ways to see it.',

{id:'pdf',nav:'Density & area',title:'Density: chance is area',lede:'A length or a time can take any value, so the chance of exactly 2.5000… is zero. We talk about the chance of an interval instead.',

words:['Think of the density curve as a pile of sand that weighs exactly 1 kilo. The chance that X lands between a and b is the amount of sand between a and b: the <b>area</b>.','The <b>height is not a chance</b>. Here it is 2 at x = 2. Only the total area has to be 1 (and the curve may never go below 0).','The expected value E[X] is the <b>balance point</b>: put the sand on a seesaw, where does it balance?','The CDF F(x) = P(X ≤ x) is “how much sand lies left of x”. Take its derivative and you get the density back.','For a new variable like the volume W = X³, go via the CDF: P(W ≤ w) = P(X ≤ w<sup>1/3</sup>).'],
rule:['f(x) ≥ 0 and ∫ f(x) dx = 1','P(a < X < b) = ∫ₐᵇ f(x) dx','E[X] = ∫ x·f(x) dx','E[g(X)] = ∫ g(x)·f(x) dx (never g(E[X]))','f(x) = F′(x)'],exam:'Exercises 1, 2, 3a–b, 19a–b.',

['f(2) = 2 for the cube edge. Is that allowed for a density?',['No, a chance can never be above 1','Yes, only the total area must be 1','Only if the interval is shorter than 1'],1,'Height is not a chance. Only areas are chances.'],

{id:'normal',nav:'Normal & uniform',title:'Normal and uniform: the two shapes you use most',lede:'The bell curve for things that vary around a target, the flat rectangle for “anything between a and b is equally likely”.',

{id:'exponential',nav:'Exponential',title:'Exponential: the waiting time that forgets',lede:'Waiting for something that happens by accident — a lamp hit by a voltage spike, a customer walking in. Nothing wears out.',

words:['<b>Memoryless</b>: if you already waited 2 minutes, the rest of your wait looks exactly like a fresh start. The dashed curve (your future) has the same shape as the original.','So a car or a human body is <b>not</b> exponential: they wear out, old ones break sooner. The uniform distribution is also not memoryless (exercise 5).','λ is the rate: events per minute. The average wait is 1/λ. Fast rate → short waits.','Double every waiting time (Y = 2X): still exponential, rate halves to λ/2.'],

quiz:[['The man already waited 2 minutes (λ = 0.32). Chance his total wait is over 5 minutes?',['0.20','e^(−3·0.32) ≈ 0.38','e^(−5·0.32) ≈ 0.20','0.62'],1,'Memoryless: he now needs 3 more minutes, as if he just arrived. e^(−0.96) ≈ 0.383.'],
['Is the exponential a good model for the lifetime of a car?',['Yes, cars fail at random','No, cars wear out, so they do remember their age'],1,'Ageing means an old car is more likely to break soon. That breaks the memoryless property.'],
['A lamp lasts more than 1 year with chance ≥ 0.95. The mean lifetime is then at least …',['0.95 years','1/0.95 ≈ 1.05 years','−1/ln(0.95) ≈ 19.5 years'],2,'e^(−λ) ≥ 0.95 → λ ≤ −ln 0.95 → mean 1/λ ≥ 19.49 years.'],
['If X ~ Exp(λ), then 2X is …',['not exponential','exponential with rate 2λ','exponential with rate λ/2'],2,'P(2X > y) = P(X > y/2) = e^(−λy/2). Longer waits = slower rate.']]},
{id:'poisson',nav:'Poisson & Erlang',title:'Poisson process: counting random arrivals',lede:'Patients arrive at random, on average one every 4 minutes. The same process gives you three distributions.',

{id:'estimators',nav:'Bias & MSE',title:'Estimators: bias, variance and MSE',lede:'An estimator is a recipe that turns your sample into a guess. Think of an archer shooting at the true θ.',

{id:'testing',nav:'Hypothesis tests',title:'Hypothesis tests: α, β, power and p-value',lede:'A test works like a court. H₀ = innocent (nothing changed). We only convict with strong evidence.',

/* ---------- build page ---------- */
let done={};try{done=JSON.parse(localStorage.getItem('statslab-v1')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('statslab-v1',JSON.stringify(done))}catch(e){}};
const nav=document.getElementById('nav'),main=document.getElementById('main');
nav.innerHTML=TOPICS.map(t=>`<a href="#${t.id}" id="n-${t.id}">${t.nav}</a>`).join('');
TOPICS.forEach((t,ti)=>{const s=el('section','topic');s.id='t-'+t.id;
 s.innerHTML=`<h2>${t.title}</h2><p class="lede">${t.lede}</p><div class="grid"><div class="lab"><p class="cap">${t.cap}</p></div><div class="words"><div class="box"><h3>In plain words</h3><ul>${t.words.map(w=>`<li>${w}</li>`).join('')}</ul></div><div class="box rule"><h3>Cheat lines</h3>${t.rule.map(r=>`<code>${r}</code>`).join('')}</div><div class="box exam"><h3>Practise on paper</h3>${t.exam}</div></div></div><div class="quiz"><h3>Quick check</h3><p class="cap">Get every question right on the first try to master this topic.</p></div><div class="next"></div>`;
 main.appendChild(s);LABS[t.id](s.querySelector('.lab'));
 const qz=s.querySelector('.quiz');const first={};
 const qbox=el('div');qz.appendChild(qbox);
 const build=()=>{qbox.innerHTML='';Object.keys(first).forEach(k=>delete first[k]);t.quiz.forEach(([q,opts,ok,ex],qi)=>{const d=el('div','q');d.innerHTML=`<p>${q}</p><div class="opts"></div><div class="expl">${ex}</div>`;const o=d.querySelector('.opts');
  opts.forEach((op,oi)=>{const b=el('button','',op);b.type='button';b.addEventListener('click',e=>{if(first[qi]===undefined)first[qi]=oi===ok;d.classList.add('answered');b.classList.add(oi===ok?'ok':'no');if(oi===ok){o.querySelectorAll('button').forEach(x=>x.disabled=true);burst(e.clientX,e.clientY)}
   if(Object.keys(first).length===t.quiz.length&&t.quiz.every((_,i)=>first[i])){done[t.id]=1;save();marks()}});o.appendChild(b)});qbox.appendChild(d)})};
 build();btn(qz,'Reset questions',build,1);
 const nx=s.querySelector('.next');const prev=TOPICS[ti-1],next=TOPICS[ti+1];nx.innerHTML=(prev?`<a href="#${prev.id}">← ${prev.nav}</a>`:'<span></span>')+(next?`<a href="#${next.id}">${next.nav} →</a>`:'');
});
main.insertAdjacentHTML('beforeend','<p class="foot">Built from your T-exercises (questions 1–40), the week 1 answers and the sections of weeks 1–2. Progress is saved in this browser only.</p>');
function marks(){let n=0;TOPICS.forEach(t=>{const d=!!done[t.id];if(d)n++;document.getElementById('n-'+t.id).classList.toggle('done',d)});document.getElementById('mcount').textContent=n+' / '+TOPICS.length;document.getElementById('mbar').style.width=(n/TOPICS.length*100)+'%'}
function burst(x,y){const cs=['#a31621','#1b5e20','#fff68f','#e6ccb2','#1c1c1c','#f7c600'];for(let i=0;i<16;i++){const b=el('span','bit');b.style.left=x+'px';b.style.top=y+'px';b.style.background=cs[i%cs.length];b.style.setProperty('--dx',(Math.random()*160-80)+'px');b.style.setProperty('--dy',(Math.random()*-140-20)+'px');document.body.appendChild(b);setTimeout(()=>b.remove(),950)}}
function route(){const id=(location.hash||'#'+TOPICS[0].id).slice(1);const t=TOPICS.find(x=>x.id===id)||TOPICS[0];document.querySelectorAll('.topic').forEach(s=>s.classList.toggle('show',s.id==='t-'+t.id));nav.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.id==='n-'+t.id));
 document.getElementById('n-'+t.id).scrollIntoView({block:'nearest',inline:'center'});requestAnimationFrame(()=>figs.forEach(F=>F.render()))}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});
const rerender=()=>figs.forEach(F=>F.render());new MutationObserver(rerender).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',rerender)}catch(e){}
marks();route();
}
